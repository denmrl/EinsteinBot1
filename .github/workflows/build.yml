name: Einstein Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1) Пересоздаём android-папку с правильным именем проекта
      - name: Regenerate Android folder (fix v1 embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=einstein_app

      # 2) Фиксим Kotlin ПОСЛЕ регенерации через три универсальных sed от DeepSeek
      - name: Fix Kotlin version
        run: |
          echo "=== build.gradle BEFORE ==="
          cat android/build.gradle || true
          
          # Groovy: id "org.jetbrains.kotlin.android" version "X.X.X" apply false
          sed -i -E 's/(id[[:space:]]+["'"'"']org\.jetbrains\.kotlin\.android["'"'"'][[:space:]]+version[[:space:]]+["'"'"'])[^"'"'"']+(["'"'"'])/\11.9.20\2/g' android/build.gradle
          
          # Kotlin DSL: id("org.jetbrains.kotlin.android") version "X.X.X"
          sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")[^"]+(")/\11.9.20\2/g' android/settings.gradle.kts || true
          
          # Legacy: ext.kotlin_version = 'X.X.X'
          sed -i -E "s/(ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"])[^'\"]+(['\"])/\11.9.20\2/g" android/build.gradle || true
          
          # Поднимаем AGP до стабильного уровня, совместимого с фоновым сервисом
          sed -i -E 's/(com\.android\.application["'"'"']?\)?[[:space:]]+version[[:space:]]+["'"'"'])[^"'"'"']+(["'"'"'])/\18.3.2\2/g' android/settings.gradle.kts || true
          sed -i -E "s/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.3.2/g" android/build.gradle || true
          
          echo "=== build.gradle AFTER ==="
          cat android/build.gradle || true

      # 3) Сборка APK
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: einstein-release-apk
          path: build/app/outputs/apk/release/*.apk

name: Einstein Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 🛠️ ЛАЙФХАК: Создаем пустые заглушки для иконок прямо в облаке, чтобы сборка не падала
      - name: Create asset directories and dummy icons
        run: |
          mkdir -p assets/icons
          convert -size 1024x1024 xc:#0E1116 assets/icons/app_icon.png
          convert -size 1024x1024 xc:#0E1116 assets/icons/app_icon_foreground.png
          convert -size 512x512 xc:#0E1116 assets/icons/splash.png

      - name: Install dependencies
        run: flutter pub get

      # Генерируем нативные иконки и сплеш-экран из созданных заглушек
      - name: Generate launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: einstein-release-apk
          path: build/app/outputs/apk/release/*.apk

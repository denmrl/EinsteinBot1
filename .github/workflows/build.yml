name: Einstein Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 🚀 Ключевое обновление: используем свежую стабильную версию Flutter,
          # которая гарантированно поддерживает 16KB выравнивание.
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=einstein_app

      - name: Overwrite gradle files
        run: |
          rm -f android/settings.gradle android/settings.gradle.kts
          rm -f android/build.gradle android/build.gradle.kts

          # 🚀 Обновляем AGP до 8.5.1, Kotlin до 1.9.25
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.5.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.25" apply false
          }
          include ":app"
          EOF

          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

          # 🚀 Указываем NDK 28, который корректно выравнивает .so файлы
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

          android {
              namespace = "com.einstein.app"
              compileSdk = 35
              ndkVersion = "27.2.12479018" // 🚀 Современный NDK для Android 15

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
                  coreLibraryDesugaringEnabled true
              }
              kotlinOptions { jvmTarget = JavaVersion.VERSION_1_8 }

              defaultConfig {
                  applicationId = "com.einstein.app"
                  minSdk = 24
                  targetSdk = 35 // 🚀 Target Android 15
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          flutter { source = "../.." }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Upgrade Gradle wrapper to 8.7
        run: sed -i 's/gradle-8.4-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;27.2.12479018" || true

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: einstein-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

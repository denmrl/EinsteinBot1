name: Einstein Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1) Пересоздаём android-папку с правильным именем проекта (устраняем v1 embedding)
      - name: Regenerate Android folder (fix v1 embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=einstein_app

      # 2) ПОЛНАЯ ПЕРЕЗАПИСЬ gradle-файлов — версии Kotlin 1.9.20 и AGP 8.3.2 жёстко зашиты
      - name: Overwrite gradle files (Kotlin 1.9.20 + AGP 8.3.2)
        run: |
          # --- Удаляем все файлы конфигурации, чтобы не было конфликтов синтаксиса ---
          rm -f android/settings.gradle
          rm -f android/settings.gradle.kts
          rm -f android/build.gradle
          rm -f android/build.gradle.kts
          
          # --- Создаем чистый settings.gradle с нужными версиями плагинов ---
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.20" apply false
          }
          include ":app"
          EOF
          
          # --- Создаем чистый корневой build.gradle ---
          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # --- Отладочный вывод для логов GitHub Actions ---
          echo "===== android/settings.gradle ====="
          cat android/settings.gradle
          echo "===== android/build.gradle ====="
          cat android/build.gradle

      # 3) Сборка APK
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 4) Выкладываем готовые файлы
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: einstein-release-apk
          path: build/app/outputs/apk/release/*.apk

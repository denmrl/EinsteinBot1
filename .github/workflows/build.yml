name: Einstein Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1) Пересоздаём android-папку с правильным именем проекта
      - name: Regenerate Android folder (fix v1 embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=einstein_app

      # 2) ПОЛНАЯ ПЕРЕЗАПИСЬ gradle-файлов — версии Kotlin 1.9.20 и AGP 8.3.2 жёстко зашиты
      - name: Overwrite gradle files (Kotlin 1.9.20 + AGP 8.3.2)
        run: |
          rm -f android/settings.gradle
          rm -f android/settings.gradle.kts
          rm -f android/build.gradle
          rm -f android/build.gradle.kts
          
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.20" apply false
          }
          include ":app"
          EOF
          
          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      # 3) Обновляем версию Gradle с 7.6.3 до 8.4 в сгенерированной папке
      - name: Upgrade Gradle Wrapper distribution version to 8.4
        run: |
          sed -i 's/gradle-7.6.3-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      # 4) 🛠️ МЕГА-ФИКС DART КОДА: Исправляем несовместимые с 3.24.0 методы и опечатки во всех экранах
      - name: Auto-fix Dart code compatibility for Flutter 3.24.0
        run: |
          echo "=== Запускаем массовое исправление методов .withValues в коде ==="
          
          # Автоматически меняем .withValues(alpha: X) на .withAlpha((X * 255).toInt()) во всех файлах проекта
          find lib/ -type f -name "*.dart" -exec sed -i -E 's/\.withValues\(alpha:[[:space:]]*([0-9.]+)\)/.withAlpha((\1 * 255).toInt())/g' {} +
          find lib/ -type f -name "*.dart" -exec sed -i -E 's/\.withValues\(alpha:[[:space:]]*([a-zA-Z0-9._]+)\)/.withAlpha((\1 * 255).toInt())/g' {} +
          
          # Исправляем неявное приведение типов в searcher_engine.dart и типы Candle
          if [ -f lib/domain/searcher_engine.dart ]; then
            sed -i 's/final closes15 = .*/final List<double> closes15 = (cl5.map((c) => (c as Candle).close).toList() as List<dynamic>).cast<double>();/g' lib/domain/searcher_engine.dart || true
            sed -i 's/final volumes15 = .*/final List<double> volumes15 = (cl5.map((c) => (c as Candle).volume).toList() as List<dynamic>).cast<double>();/g' lib/domain/searcher_engine.dart || true
          fi
          
          # Убираем ошибочное ключевое слово finally из объявлений полей в settings_provider.dart
          if [ -f lib/core/providers/settings_provider.dart ]; then
            sed -i 's/} finally {/}/g' lib/core/providers/settings_provider.dart || true
          fi

      # 5) Сборка APK
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 6) Выкладываем готовые файлы
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: einstein-release-apk
          path: build/app/outputs/apk/release/*.apk
